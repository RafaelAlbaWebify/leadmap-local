name: Temporary Fix Shortlist Tests PR106

on:
  push:
    branches:
      - feature/webify-commercial-shortlist
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-fix-shortlist-tests-pr106-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/webify-commercial-shortlist
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch shared options and test events
        run: |
          python - <<'PY'
          from pathlib import Path
          legacy = Path('frontend/src/BusinessWorkspaceLegacy.tsx')
          text = legacy.read_text(encoding='utf-8')
          text = text.replace('import type { BusinessDetail, BusinessNote, Lead, QualificationStatus } from "./types";\n', 'import type { BusinessDetail, BusinessNote, Lead, QualificationStatus } from "./types";\nimport { qualificationOptions } from "./qualificationOptions";\n')
          start = text.find('const qualificationOptions: Array<{ value: QualificationStatus; label: string }> = [')
          if start != -1:
              end = text.find('];\n\nfunction formatDate', start)
              if end == -1:
                  raise SystemExit('Could not find qualification options end')
              text = text[:start] + text[end + len('];\n\n'):]
          legacy.write_text(text, encoding='utf-8')

          views = Path('frontend/src/BusinessViewsWorkspace.tsx')
          text = views.read_text(encoding='utf-8')
          text = text.replace('import { BusinessWorkspace, qualificationOptions } from "./BusinessWorkspaceLegacy";\n', 'import { BusinessWorkspace } from "./BusinessWorkspaceLegacy";\n')
          if 'import { qualificationOptions } from "./qualificationOptions";\n' not in text:
              text = text.replace('import type { Lead } from "./types";\n', 'import type { Lead } from "./types";\nimport { qualificationOptions } from "./qualificationOptions";\n')
          views.write_text(text, encoding='utf-8')

          test = Path('frontend/src/WebifyShortlistWorkspace.test.tsx')
          text = test.read_text(encoding='utf-8')
          text = text.replace('import { render, screen } from "@testing-library/react";\nimport userEvent from "@testing-library/user-event";\n', 'import { fireEvent, render, screen } from "@testing-library/react";\n')
          text = text.replace('      const user = userEvent.setup();\n', '')
          text = text.replace('      await user.click(screen.getByLabelText("Select Alpha Dental"));\n      await user.click(screen.getByRole("button", { name: "Export JSON for Veridra" }));\n', '      fireEvent.click(screen.getByLabelText("Select Alpha Dental"));\n      fireEvent.click(screen.getByRole("button", { name: "Export JSON for Veridra" }));\n')
          test.write_text(text, encoding='utf-8')
          PY
      - name: Commit test fixes
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/BusinessWorkspaceLegacy.tsx frontend/src/BusinessViewsWorkspace.tsx frontend/src/WebifyShortlistWorkspace.test.tsx
          git commit -m 'Fix shortlist frontend tests'
          git push origin HEAD:feature/webify-commercial-shortlist
