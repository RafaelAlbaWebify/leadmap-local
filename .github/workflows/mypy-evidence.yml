name: Mypy Evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - name: Capture mypy output
        continue-on-error: true
        run: mypy backend --strict > mypy.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: mypy-evidence
          path: mypy.txt
          if-no-files-found: error
