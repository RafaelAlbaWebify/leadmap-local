name: Market Indicators

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: market-indicators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Focused tests
        run: pytest backend/tests/test_market_indicators.py --no-cov --junitxml=artifacts/market-indicator-tests.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-indicator-tests-${{ runner.os }}
          path: artifacts/market-indicator-tests.xml
          if-no-files-found: error
      - name: Import approved fixture
        run: python scripts/install-market-indicators.py backend/tests/fixtures/market-indicators-approved.json --directory artifacts/market-indicators
      - uses: actions/upload-artifact@v4
        with:
          name: market-indicators-${{ runner.os }}
          path: artifacts/market-indicators/*.json
          if-no-files-found: error
