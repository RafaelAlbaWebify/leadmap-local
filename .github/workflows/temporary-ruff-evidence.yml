name: Temporary Ruff Evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff JSON
        shell: bash
        run: |
          mkdir -p artifacts
          ruff check backend --output-format=json > artifacts/ruff.json || true
          cat artifacts/ruff.json
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-ruff-evidence
          path: artifacts/ruff.json
          if-no-files-found: error
